<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>
Create Account | Nethra Senior Care
</title>
<meta name="description"
content="Create your Nethra Senior Care account for personalized senior care services and support.">
<link rel="icon"
href="../images/favicon.png">
<link rel="stylesheet"
href="../global/global.css">
<link rel="stylesheet"
href="../css/com.css">
<link rel="stylesheet"
href="auth.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect"
href="https://fonts.googleapis.com">
<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">
</head>
<body class="auth-page">
<!-- =========================
TOP ACTION BUTTONS
========================= -->
<div class="top-actions">
<button class="icon-btn"
id="rtlToggle"
aria-label="Toggle RTL">
<i class="fa-solid fa-right-left"></i>
</button>
<button class="icon-btn"
id="themeToggle"
aria-label="Toggle Dark Mode">
<i class="fa-solid fa-moon"></i>
</button>
</div>
<!-- =========================
AUTH WRAPPER
========================= -->
<main class="auth-wrapper">
<section class="auth-card signup-card">
<a href="../index.html"
class="logo-box">
<img
src="../images/slogo.jpg.png"
alt="Nethra Senior Care Logo"
class="nav-logo-img">
<div class="logo-text">
<span class="brand-name">
NETHRA
</span>
<span class="brand-subtext">
SENIOR CARE
</span>
</div>
</a>
<h1>
Create Account
</h1>
<p class="auth-desc">
Create your account and get access to
personalized senior care support.
</p>
<form class="auth-form signup-form">
<div class="form-group">
<label for="name">
Full Name
</label>
<input
id="name"
type="text"
placeholder="Enter your full name"
autocomplete="name"
required>
</div>
<div class="form-group">
<label for="email">
Email Address
</label>
<input
id="email"
type="email"
placeholder="Enter your email address"
autocomplete="email"
required>
</div>
<div class="form-group">
<label for="phone">
Phone Number
</label>
<input
id="phone"
type="tel"
placeholder="Enter your phone number"
autocomplete="tel"
required>
</div>
<div class="form-group">
<label for="password">
Password
</label>
<div class="password-box">
<input
id="password"
type="password"
placeholder="Create password"
required>
<i class="fa-solid fa-eye toggle-password"></i>
</div>
</div>
<div class="form-group">
<label for="confirmPassword">
Confirm Password
</label>
<div class="password-box">
<input
id="confirmPassword"
type="password"
placeholder="Confirm password"
required>
<i class="fa-solid fa-eye toggle-password"></i>
</div>
</div>
<div class="form-full">
<label class="remember">
<input
type="checkbox"
required>
<span>
I agree to Terms & Privacy Policy
</span>
</label>
</div>
<div class="form-full">
<button
type="submit"
class="auth-btn">
Create Account
</button>
</div>
</form>
<div class="divider">
<span>
OR CONTINUE WITH
</span>
</div>
<div class="social-login">
<button
type="button"
class="social-btn">
<i class="fa-brands fa-google"></i>
<span>
Google
</span>
</button>
<button
type="button"
class="social-btn">
<i class="fa-brands fa-apple"></i>
<span>
Apple
</span>
</button>
<button
type="button"
class="social-btn">
<i class="fa-brands fa-facebook-f"></i>
<span>
Facebook
</span>
</button>
</div>
<footer class="auth-footer">
<p>
Already have an account?
<a href="signin.html">
Sign In
</a>
</p>
</footer>
</section>
</main>
<script src="../global/global.js"></script>
<script src="auth.js"></script>
</body>
</html>
